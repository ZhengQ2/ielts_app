AWSTemplateFormatVersion: '2010-09-09'
Description: Low-cost static hosting for the IELTS test centre finder

Parameters:
  DomainName:
    Type: String
    Default: ielts.zhengqiu.net
  HostedZoneId:
    Type: String
    Description: Route 53 hosted zone containing the production domain
Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        Description: Signed access from CloudFront to the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RouteRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-routes'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve clean Next.js URLs to exported index.html files
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri += '/index.html';
          }

          return request;
        }

  CentreOverridesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: centreId
          AttributeType: S
      KeySchema:
        - AttributeName: centreId
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  AdminUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-admins'
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  AdminUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref AdminUserPool
      ClientName: !Sub '${AWS::StackName}-internal-web'
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Sub 'https://${DomainName}/internal/'
        - 'http://localhost:3000/internal/'
      LogoutURLs:
        - !Sub 'https://${DomainName}/internal/'
        - 'http://localhost:3000/internal/'
      SupportedIdentityProviders:
        - COGNITO
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  AdminUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${AWS::StackName}-${AWS::AccountId}'
      UserPoolId: !Ref AdminUserPool

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      Description: May edit IELTS centre records through the internal API
      UserPoolId: !Ref AdminUserPool

  AdminApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: centre-admin-api
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${SiteBucket.Arn}/data/centres.json'
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !GetAtt CentreOverridesTable.Arn

  AdminApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Authenticated centre override API and merged public centre feed
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt AdminApiRole.Arn
      MemorySize: 512
      Timeout: 20
      Environment:
        Variables:
          SITE_BUCKET: !Ref SiteBucket
          OVERRIDES_TABLE: !Ref CentreOverridesTable
          USER_POOL_ID: !Ref AdminUserPool
          USER_POOL_CLIENT_ID: !Ref AdminUserPoolClient
          COGNITO_DOMAIN: !Sub '${AWS::StackName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com'
      Code:
        ZipFile: |
          import json
          import math
          import os
          import re
          import time
          from datetime import datetime, timezone
          from urllib.parse import unquote, urlsplit
          from uuid import uuid4

          import boto3
          from botocore.exceptions import ClientError

          KNOWN_COUNTRY_OR_REGION_CODES = {
              "AE", "AG", "AL", "AM", "AR", "AT", "AU", "AW", "AZ", "BA", "BB", "BD", "BE", "BG", "BH", "BN", "BO", "BR", "BS", "BT", "BW", "BY", "BZ", "CA", "CH", "CI", "CL", "CM", "CN", "CO", "CR", "CW", "CY", "CZ", "DE", "DK", "DM", "DO", "DZ", "EC", "EE", "EG", "ES", "ET", "FI", "FJ", "FR", "GB", "GD", "GE", "GG", "GH", "GM", "GP", "GR", "GT", "GY", "HK", "HN", "HR", "HT", "HU", "ID", "IE", "IL", "IM", "IN", "IQ", "IR", "IS", "IT", "JE", "JM", "JO", "JP", "KE", "KG", "KH", "KI", "KN", "KR", "KW", "KZ", "LA", "LB", "LC", "LK", "LT", "LU", "LV", "LY", "MA", "MD", "ME", "MF", "MG", "MK", "MM", "MN", "MO", "MQ", "MT", "MU", "MV", "MW", "MX", "MY", "MZ", "NA", "NC", "NG", "NI", "NL", "NO", "NP", "NR", "NZ", "OM", "PA", "PE", "PF", "PG", "PH", "PK", "PL", "PS", "PT", "PW", "PY", "QA", "RE", "RO", "RS", "RW", "SA", "SB", "SC", "SE", "SG", "SI", "SK", "SL", "SN", "SR", "SV", "SY", "TG", "TH", "TJ", "TL", "TN", "TO", "TR", "TT", "TV", "TW", "TZ", "UA", "UG", "US", "UY", "UZ", "VA", "VC", "VE", "VN", "VU", "WS", "XK", "YE", "ZA", "ZM", "ZW"
          }
          MAX_PUBLIC_FEED_RESPONSE_BYTES = 5500000
          PUBLIC_FEED_WRITE_LOCK_ID = "__public_feed_write_lock__"

          s3 = boto3.client("s3")
          dynamodb = boto3.client("dynamodb")
          bucket = os.environ["SITE_BUCKET"]
          table = os.environ["OVERRIDES_TABLE"]
          base_cache = {"loaded": 0, "value": None}

          def response(status, body=None, cache="no-store"):
              headers = {
                  "content-type": "application/json; charset=utf-8",
                  "cache-control": cache,
                  "x-content-type-options": "nosniff",
              }
              return {
                  "statusCode": status,
                  "headers": headers,
                  "body": "" if body is None else json.dumps(body, separators=(",", ":")),
              }

          def base_feed():
              now = time.time()
              if base_cache["value"] is None or now - base_cache["loaded"] > 30:
                  item = s3.get_object(Bucket=bucket, Key="data/centres.json")
                  base_cache["value"] = json.loads(item["Body"].read())
                  base_cache["loaded"] = now
              return base_cache["value"]

          def stored_overrides():
              items = []
              request = {"TableName": table, "ConsistentRead": True}
              while True:
                  result = dynamodb.scan(**request)
                  items.extend(result.get("Items", []))
                  key = result.get("LastEvaluatedKey")
                  if not key:
                      break
                  request["ExclusiveStartKey"] = key
              output = []
              for item in items:
                  try:
                      output.append({
                          "centreId": item["centreId"]["S"],
                          "patch": json.loads(item["patchJson"]["S"]),
                          "created": item.get("recordType", {}).get("S") == "created",
                          "updatedAt": item["updatedAt"]["S"],
                          "updatedBy": item["updatedBy"]["S"],
                      })
                  except (KeyError, TypeError, ValueError):
                      continue
              return output

          def merged_feed(stored=None):
              base = base_feed()
              if stored is None:
                  stored = stored_overrides()
              patches = {
                  item["centreId"]: item["patch"]
                  for item in stored
                  if not item.get("created")
              }
              centres = []
              for centre in base.get("centres", []):
                  merged = {**centre, **patches.get(centre.get("id"), {})}
                  merged["id"] = centre.get("id")
                  if merged.get("isPublishable") is False and not merged.get("futureOpening"):
                      continue
                  centres.append(merged)
              for item in stored:
                  if not item.get("created"):
                      continue
                  centre = {**item["patch"], "id": item["centreId"]}
                  if centre.get("isPublishable") is False and not centre.get("futureOpening"):
                      continue
                  centres.append(centre)
              return {**base, "count": len(centres), "centres": centres}

          def assert_public_feed_fits(centre_id, value, created):
              stored = [
                  item for item in stored_overrides()
                  if item.get("centreId") != centre_id
              ]
              if value is not None:
                  stored.append({
                      "centreId": centre_id,
                      "patch": value,
                      "created": created,
                      "updatedAt": "prospective",
                      "updatedBy": "prospective",
                  })
              prospective = response(
                  200,
                  merged_feed(stored),
                  "public,max-age=60,s-maxage=60",
              )
              payload_bytes = len(
                  json.dumps(prospective, separators=(",", ":")).encode("utf-8")
              )
              if payload_bytes > MAX_PUBLIC_FEED_RESPONSE_BYTES:
                  raise ValueError(
                      "this change would make the public centre feed too large; "
                      "deploy a compacted base dataset before adding more data"
                  )

          def acquire_public_feed_write_lock(identity):
              now = int(time.time())
              token = str(uuid4())
              dynamodb.put_item(
                  TableName=table,
                  Item={
                      "centreId": {"S": PUBLIC_FEED_WRITE_LOCK_ID},
                      "recordType": {"S": "write_lock"},
                      "updatedAt": {"S": datetime.now(timezone.utc).isoformat()},
                      "updatedBy": {"S": identity},
                      "lockToken": {"S": token},
                      "expiresAt": {"N": str(now + 30)},
                  },
                  ConditionExpression="attribute_not_exists(centreId) OR expiresAt < :now",
                  ExpressionAttributeValues={":now": {"N": str(now)}},
              )
              return token

          def release_public_feed_write_lock(token):
              try:
                  dynamodb.delete_item(
                      TableName=table,
                      Key={"centreId": {"S": PUBLIC_FEED_WRITE_LOCK_ID}},
                      ConditionExpression="lockToken = :token",
                      ExpressionAttributeValues={":token": {"S": token}},
                  )
              except ClientError as error:
                  if error.response.get("Error", {}).get("Code") != "ConditionalCheckFailedException":
                      raise

          def claims(event):
              return (
                  event.get("requestContext", {})
                  .get("authorizer", {})
                  .get("jwt", {})
                  .get("claims", {})
              )

          def is_admin(event):
              value = claims(event).get("cognito:groups", "")
              if isinstance(value, list):
                  return "admins" in value
              groups = {
                  item.strip().strip('"').strip("'")
                  for item in str(value).replace("[", "").replace("]", "").split(",")
              }
              return "admins" in groups

          def centre_by_id(centre_id):
              return next(
                  (item for item in base_feed().get("centres", []) if item.get("id") == centre_id),
                  None,
              )

          def stored_record_by_id(centre_id):
              result = dynamodb.get_item(
                  TableName=table,
                  Key={"centreId": {"S": centre_id}},
                  ConsistentRead=True,
              )
              item = result.get("Item")
              if not item:
                  return None
              try:
                  return {
                      "centreId": item["centreId"]["S"],
                      "patch": json.loads(item["patchJson"]["S"]),
                      "created": item.get("recordType", {}).get("S") == "created",
                      "updatedAt": item["updatedAt"]["S"],
                  }
              except (KeyError, TypeError, ValueError):
                  return None

          def store_record(centre_id, value, identity, created, expected_updated_at=None):
              updated_at = datetime.now(timezone.utc).isoformat()
              item = {
                  "centreId": {"S": centre_id},
                  "patchJson": {"S": json.dumps(value, separators=(",", ":"))},
                  "updatedAt": {"S": updated_at},
                  "updatedBy": {"S": identity},
              }
              if created:
                  item["recordType"] = {"S": "created"}
              request = {
                  "TableName": table,
                  "Item": item,
              }
              if expected_updated_at is None:
                  request["ConditionExpression"] = "attribute_not_exists(centreId)"
              else:
                  request["ConditionExpression"] = "#updatedAt = :expected"
                  request["ExpressionAttributeNames"] = {"#updatedAt": "updatedAt"}
                  request["ExpressionAttributeValues"] = {
                      ":expected": {"S": expected_updated_at},
                  }
              dynamodb.put_item(**request)
              return {
                  "centreId": centre_id,
                  "patch": value,
                  "created": created,
                  "updatedAt": updated_at,
                  "updatedBy": identity,
              }

          def require_object(value, path):
              if not isinstance(value, dict):
                  raise ValueError(path + " must be an object")
              return value

          def require_string(value, path, nullable=False, nonempty=False):
              if nullable and value is None:
                  return
              if not isinstance(value, str) or (nonempty and not value.strip()):
                  suffix = " or null" if nullable else ""
                  raise ValueError(path + " must be a string" + suffix)

          def require_bool(value, path):
              if not isinstance(value, bool):
                  raise ValueError(path + " must be boolean")

          def require_number(value, path, nullable=False, minimum=None, maximum=None):
              if nullable and value is None:
                  return
              if isinstance(value, bool) or not isinstance(value, (int, float)):
                  suffix = " or null" if nullable else ""
                  raise ValueError(path + " must be a finite number" + suffix)
              try:
                  finite = math.isfinite(value)
              except OverflowError:
                  finite = False
              if not finite:
                  suffix = " or null" if nullable else ""
                  raise ValueError(path + " must be a finite number" + suffix)
              if minimum is not None and value < minimum:
                  raise ValueError(path + " is below its minimum")
              if maximum is not None and value > maximum:
                  raise ValueError(path + " is above its maximum")

          def require_enum(value, allowed, path, nullable=False):
              if nullable and value is None:
                  return
              if not isinstance(value, str) or value not in allowed:
                  raise ValueError(path + " has an unsupported value")

          def require_string_array(value, path):
              if not isinstance(value, list):
                  raise ValueError(path + " must be an array")
              for index, item in enumerate(value):
                  require_string(item, f"{path}[{index}]")

          def validate_centre(centre):
              require_object(centre, "centre")
              required = {
                  "id", "name", "operator", "operatorSource", "externalId", "ieltsOrgSlug",
                  "mergedSlugs", "address", "contact", "phone", "geo", "googlePlaceId",
                  "formats", "offerings", "priceFromText", "parsedPriceFrom", "parsedCurrency",
                  "bookingUrl", "offersOneSkillRetake", "oneSkillRetakeOnly", "isPublishable",
                  "confidence", "sources", "firstSeenAt", "lastSeenAt",
              }
              missing = sorted(required - set(centre))
              if missing:
                  raise ValueError("missing centre fields: " + ", ".join(missing))

              require_string(centre["id"], "id", nonempty=True)
              require_string(centre["name"], "name", nonempty=True)
              require_enum(centre["operator"], {"IDP", "British Council", "IELTS USA", "unknown"}, "operator")
              require_enum(centre["operatorSource"], {"booking_domain", "slug", "name", "unknown"}, "operatorSource")
              require_string(centre["externalId"], "externalId", nullable=True)
              require_string(centre["ieltsOrgSlug"], "ieltsOrgSlug", nonempty=True)
              require_string_array(centre["mergedSlugs"], "mergedSlugs")

              address = require_object(centre["address"], "address")
              for key in ("raw", "lines", "city", "region", "postcode", "country"):
                  if key not in address:
                      raise ValueError("address." + key + " is required")
              require_string(address["raw"], "address.raw", nonempty=True)
              require_string_array(address["lines"], "address.lines")
              for key in ("city", "region", "postcode", "country"):
                  require_string(address[key], "address." + key, nullable=True)
              if "citySource" in address:
                  require_enum(address["citySource"], {"address_rule", "geocoder", "legacy", "admin"}, "address.citySource", nullable=True)

              contact = require_object(centre["contact"], "contact")
              for key in ("phones", "emails", "websites"):
                  if key not in contact:
                      raise ValueError("contact." + key + " is required")
                  require_string_array(contact[key], "contact." + key)
              require_string(centre["phone"], "phone", nullable=True)

              geo = centre["geo"]
              if geo is not None:
                  geo = require_object(geo, "geo")
                  for key in ("lat", "lng", "precision", "source", "coordinateSystem", "verification", "evidencePaths", "agreementKm", "confidence"):
                      if key not in geo:
                          raise ValueError("geo." + key + " is required")
                  require_number(geo["lat"], "geo.lat", minimum=-90, maximum=90)
                  require_number(geo["lng"], "geo.lng", minimum=-180, maximum=180)
                  require_enum(geo["precision"], {"rooftop", "street", "postcode", "city", "country", "approximate"}, "geo.precision")
                  require_enum(geo["source"], {"page_embed", "google", "google_places", "overture", "amap_places", "mapbox", "nominatim", "amap", "mappls", "kakao", "naver", "crowd", "admin"}, "geo.source")
                  require_enum(geo["coordinateSystem"], {"WGS84"}, "geo.coordinateSystem")
                  require_enum(geo["verification"], {"verified", "approximate", "unverified", "conflicted"}, "geo.verification")
                  require_string_array(geo["evidencePaths"], "geo.evidencePaths")
                  for index, evidence in enumerate(geo["evidencePaths"]):
                      require_enum(evidence, {"page_embed", "address", "venue_name", "plus_code", "operator_map", "admin"}, f"geo.evidencePaths[{index}]")
                  require_number(geo["agreementKm"], "geo.agreementKm", nullable=True, minimum=0)
                  require_number(geo["confidence"], "geo.confidence", minimum=0, maximum=1)
                  if "provenance" in geo:
                      provenance = require_object(geo["provenance"], "geo.provenance")
                      for key in ("origin", "displayRights", "license", "attribution", "sourceRecordId"):
                          if key not in provenance:
                              raise ValueError("geo.provenance." + key + " is required")
                      require_enum(provenance["origin"], {"ielts_org", "google_maps_platform", "overture_maps", "openstreetmap", "community_submission", "administrator", "third_party_provider", "unknown"}, "geo.provenance.origin")
                      require_enum(provenance["displayRights"], {"any_basemap", "google_maps_only", "provider_review_required"}, "geo.provenance.displayRights")
                      for key in ("license", "attribution", "sourceRecordId"):
                          require_string(provenance[key], "geo.provenance." + key, nullable=True)

              require_string(centre["googlePlaceId"], "googlePlaceId", nullable=True)
              require_string_array(centre["formats"], "formats")
              for index, value in enumerate(centre["formats"]):
                  require_enum(value, {"computer_delivered", "paper_based"}, f"formats[{index}]")

              offerings = centre["offerings"]
              if not isinstance(offerings, list):
                  raise ValueError("offerings must be an array")
              for index, offering_value in enumerate(offerings):
                  path = f"offerings[{index}]"
                  offering = require_object(offering_value, path)
                  for key in ("label", "kind", "format", "priceText", "parsedCurrency", "parsedPrice", "priceParseStatus"):
                      if key not in offering:
                          raise ValueError(path + "." + key + " is required")
                  require_string(offering["label"], path + ".label", nonempty=True)
                  require_enum(offering["kind"], {"academic", "general_training", "ukvi", "osr", "life_skills", "other"}, path + ".kind")
                  require_enum(offering["format"], {"computer_delivered", "paper_based"}, path + ".format")
                  require_string(offering["priceText"], path + ".priceText", nullable=True)
                  require_string(offering["parsedCurrency"], path + ".parsedCurrency", nullable=True)
                  require_number(offering["parsedPrice"], path + ".parsedPrice", nullable=True, minimum=0)
                  require_enum(offering["priceParseStatus"], {"verified", "unparsed", "missing"}, path + ".priceParseStatus")
                  if "module" in offering:
                      require_enum(offering["module"], {"academic", "general_training", "life_skills", "other"}, path + ".module")
                  if "category" in offering:
                      require_enum(offering["category"], {"standard", "ukvi_selt"}, path + ".category")

              for key in ("priceFromText", "parsedCurrency", "bookingUrl"):
                  require_string(centre[key], key, nullable=True)
              require_number(centre["parsedPriceFrom"], "parsedPriceFrom", nullable=True, minimum=0)
              require_bool(centre["offersOneSkillRetake"], "offersOneSkillRetake")
              require_bool(centre["oneSkillRetakeOnly"], "oneSkillRetakeOnly")
              require_bool(centre["isPublishable"], "isPublishable")
              require_number(centre["confidence"], "confidence", minimum=0, maximum=1)

              sources = centre["sources"]
              if not isinstance(sources, list):
                  raise ValueError("sources must be an array")
              for index, source_value in enumerate(sources):
                  path = f"sources[{index}]"
                  source = require_object(source_value, path)
                  for key in ("source", "externalSlug", "url", "seenAt", "stillPresent"):
                      if key not in source:
                          raise ValueError(path + "." + key + " is required")
                  for key in ("source", "externalSlug", "url", "seenAt"):
                      require_string(source[key], path + "." + key)
                  require_bool(source["stillPresent"], path + ".stillPresent")

              if "localizations" in centre:
                  localizations = centre["localizations"]
                  if not isinstance(localizations, list):
                      raise ValueError("localizations must be an array")
                  for index, localization_value in enumerate(localizations):
                      path = f"localizations[{index}]"
                      localization = require_object(localization_value, path)
                      for key in ("locale", "name", "address", "nameSource", "addressSource"):
                          if key not in localization:
                              raise ValueError(path + "." + key + " is required")
                      require_enum(localization["locale"], {"zh-CN", "hi-IN"}, path + ".locale")
                      for key in ("name", "address"):
                          require_string(localization[key], path + "." + key, nullable=True)
                      for key in ("nameSource", "addressSource"):
                          require_enum(localization[key], {"amap", "mappls", "admin"}, path + "." + key, nullable=True)

              if "futureOpening" in centre:
                  future = require_object(centre["futureOpening"], "futureOpening")
                  for key in ("source", "sourceUrl", "sourceLabel"):
                      if key not in future:
                          raise ValueError("futureOpening." + key + " is required")
                  require_enum(future["source"], {"ielts_usa_network"}, "futureOpening.source")
                  require_string(future["sourceUrl"], "futureOpening.sourceUrl")
                  require_string(future["sourceLabel"], "futureOpening.sourceLabel")

              require_string(centre["firstSeenAt"], "firstSeenAt")
              require_string(centre["lastSeenAt"], "lastSeenAt")

          def validate_patch(centre_id, patch):
              if not isinstance(patch, dict):
                  raise ValueError("patch must be an object")
              if "id" in patch:
                  raise ValueError("centre id cannot be changed")
              if len(json.dumps(patch)) > 300000:
                  raise ValueError("patch is too large")
              base = centre_by_id(centre_id)
              if base is None:
                  raise LookupError("centre not found")
              if "ieltsOrgSlug" in patch and patch["ieltsOrgSlug"] != base.get("ieltsOrgSlug"):
                  raise ValueError("IELTS.org route slug cannot be changed without a deployment")
              schema_optional = {"localizations", "futureOpening"}
              unknown = sorted(set(patch) - set(base) - schema_optional)
              if unknown:
                  raise ValueError("unknown top-level fields: " + ", ".join(unknown))
              merged = {**base, **patch, "id": centre_id}
              validate_centre(merged)
              return patch

          def validate_created_centre(centre, expected_id=None):
              validate_centre(centre)
              if len(json.dumps(centre)) > 300000:
                  raise ValueError("centre is too large")
              centre_id = centre.get("id")
              if expected_id is not None and centre_id != expected_id:
                  raise ValueError("centre id cannot be changed")
              if not centre_id.startswith("manual-"):
                  raise ValueError("a manually added centre id must start with manual-")
              if centre.get("ieltsOrgSlug") != "added":
                  raise ValueError("a manually added centre must use the reserved added route")
              if centre.get("operator") not in {"IDP", "British Council", "IELTS USA"}:
                  raise ValueError("a manually added centre requires a known operator")
              country = centre.get("address", {}).get("country")
              if country not in KNOWN_COUNTRY_OR_REGION_CODES:
                  raise ValueError("a manually added centre requires an ISO two-letter country code")
              city = centre.get("address", {}).get("city")
              if not isinstance(city, str) or not city.strip():
                  raise ValueError("a manually added centre requires a city")
              geo = centre.get("geo")
              if geo is not None and (
                  geo.get("source") != "admin"
                  or geo.get("verification") != "verified"
                  or geo.get("precision") not in {"street", "rooftop"}
                  or "admin" not in geo.get("evidencePaths", [])
                  or geo.get("provenance", {}).get("origin") != "administrator"
                  or geo.get("provenance", {}).get("displayRights") != "any_basemap"
              ):
                  raise ValueError("a manually added coordinate requires verified administrator provenance")
              sources = centre.get("sources", [])
              if not sources or not any(
                  source.get("source") == "Administrator"
                  and source.get("externalSlug") == centre_id
                  for source in sources
              ):
                  raise ValueError("a manually added centre requires administrator source evidence")
              urls = [source.get("url") for source in sources]
              if centre.get("bookingUrl"):
                  urls.append(centre["bookingUrl"])
              urls.extend(centre.get("contact", {}).get("websites", []))
              for value in urls:
                  try:
                      parsed = urlsplit(value)
                      trusted = (
                          parsed.scheme == "https"
                          and bool(parsed.hostname)
                          and not parsed.username
                          and not parsed.password
                      )
                  except (TypeError, ValueError):
                      trusted = False
                  if not trusted:
                      raise ValueError("manually added centre URLs must use HTTPS")
              if centre.get("oneSkillRetakeOnly") and not centre.get("offersOneSkillRetake"):
                  raise ValueError("an OSR-only centre must offer One Skill Retake")
              if not centre.get("oneSkillRetakeOnly") and not any(
                  isinstance(offering.get("priceText"), str) and offering["priceText"].strip()
                  for offering in centre.get("offerings", [])
              ):
                  raise ValueError("a full-test centre requires at least one source-published price")
              if any(
                  offering.get("module") == "life_skills"
                  and offering.get("category") != "ukvi_selt"
                  for offering in centre.get("offerings", [])
              ):
                  raise ValueError("Life Skills must use the UKVI / SELT category")
              return centre

          def handler(event, context):
              method = event.get("requestContext", {}).get("http", {}).get("method", "GET")
              path = event.get("rawPath", "")

              if method == "GET" and path == "/internal-api/config":
                  domain = "https://" + os.environ["COGNITO_DOMAIN"]
                  return response(200, {
                      "clientId": os.environ["USER_POOL_CLIENT_ID"],
                      "authorizeUrl": domain + "/oauth2/authorize",
                      "tokenUrl": domain + "/oauth2/token",
                      "logoutUrl": domain + "/logout",
                  })

              if method == "HEAD" and path == "/data/centres.json":
                  return response(200, None, "public,max-age=60,s-maxage=60")

              if method == "GET" and path == "/data/centres.json":
                  return response(200, merged_feed(), "public,max-age=60,s-maxage=60")

              if not is_admin(event):
                  return response(403, {"error": "administrator membership required"})

              if method == "GET" and path == "/internal-api/base-centres":
                  return response(200, base_feed())

              if method == "GET" and path == "/internal-api/overrides":
                  return response(200, {"overrides": stored_overrides()})

              identity = claims(event).get("email") or claims(event).get("sub") or "unknown"

              if method == "POST" and path == "/internal-api/centres":
                  try:
                      payload = json.loads(event.get("body") or "{}")
                      centre = validate_created_centre(payload.get("centre"))
                      centre_id = centre["id"]
                      if centre_by_id(centre_id) is not None:
                          return response(409, {"error": "a centre with this generated id already exists"})
                  except (TypeError, ValueError, json.JSONDecodeError) as error:
                      return response(400, {"error": str(error)})
                  lock_token = None
                  try:
                      lock_token = acquire_public_feed_write_lock(identity)
                      assert_public_feed_fits(centre_id, centre, True)
                      return response(201, store_record(centre_id, centre, identity, True))
                  except ValueError as error:
                      return response(409, {"error": str(error)})
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                          message = (
                              "the centre was created by another administrator"
                              if lock_token
                              else "another administrator is saving; retry this change"
                          )
                          return response(409, {"error": message})
                      raise
                  finally:
                      if lock_token:
                          release_public_feed_write_lock(lock_token)

              centre_id = unquote((event.get("pathParameters") or {}).get("id", ""))
              if not centre_id:
                  return response(400, {"error": "centre id is required"})

              if method == "DELETE":
                  expected_updated_at = (event.get("headers") or {}).get("if-match")
                  if not expected_updated_at:
                      return response(428, {"error": "the saved version is required"})
                  lock_token = None
                  try:
                      lock_token = acquire_public_feed_write_lock(identity)
                      assert_public_feed_fits(centre_id, None, False)
                      dynamodb.delete_item(
                          TableName=table,
                          Key={"centreId": {"S": centre_id}},
                          ConditionExpression="#updatedAt = :expected",
                          ExpressionAttributeNames={"#updatedAt": "updatedAt"},
                          ExpressionAttributeValues={":expected": {"S": expected_updated_at}},
                      )
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                          message = (
                              "the centre changed after you opened it; reload before deleting"
                              if lock_token
                              else "another administrator is saving; retry this change"
                          )
                          return response(409, {"error": message})
                      raise
                  except ValueError as error:
                      return response(409, {"error": str(error)})
                  finally:
                      if lock_token:
                          release_public_feed_write_lock(lock_token)
                  return response(204)

              if method == "PUT":
                  try:
                      payload = json.loads(event.get("body") or "{}")
                      expected_updated_at = payload.get("expectedUpdatedAt")
                      if expected_updated_at is not None and not isinstance(expected_updated_at, str):
                          raise ValueError("expectedUpdatedAt must be a string or null")
                      stored = stored_record_by_id(centre_id)
                      if stored and stored.get("created"):
                          patch = validate_created_centre(payload.get("centre"), centre_id)
                          created = True
                      else:
                          patch = validate_patch(centre_id, payload.get("patch"))
                          created = False
                  except LookupError as error:
                      return response(404, {"error": str(error)})
                  except (TypeError, ValueError, json.JSONDecodeError) as error:
                      return response(400, {"error": str(error)})
                  lock_token = None
                  try:
                      lock_token = acquire_public_feed_write_lock(identity)
                      assert_public_feed_fits(centre_id, patch, created)
                      return response(
                          200,
                          store_record(
                              centre_id,
                              patch,
                              identity,
                              created,
                              expected_updated_at,
                          ),
                      )
                  except ValueError as error:
                      return response(409, {"error": str(error)})
                  except ClientError as error:
                      if error.response.get("Error", {}).get("Code") == "ConditionalCheckFailedException":
                          message = (
                              "the centre changed after you opened it; reload before saving"
                              if lock_token
                              else "another administrator is saving; retry this change"
                          )
                          return response(409, {"error": message})
                      raise
                  finally:
                      if lock_token:
                          release_public_feed_write_lock(lock_token)

              return response(404, {"error": "route not found"})

  AdminApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-admin'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowCredentials: false
        AllowHeaders:
          - authorization
          - content-type
          - if-match
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowOrigins:
          - !Sub 'https://${DomainName}'
          - 'http://localhost:3000'
        MaxAge: 600

  AdminApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref AdminApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 20000

  AdminApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref AdminApi
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      Name: cognito-admins
      JwtConfiguration:
        Audience:
          - !Ref AdminUserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminUserPool}'

  AdminApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref AdminApi
      StageName: '$default'
      AutoDeploy: true

  AdminConfigRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'GET /internal-api/config'
      Target: !Sub 'integrations/${AdminApiIntegration}'

  PublicCentresRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'GET /data/centres.json'
      Target: !Sub 'integrations/${AdminApiIntegration}'

  PublicCentresHeadRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'HEAD /data/centres.json'
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminBaseCentresRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'GET /internal-api/base-centres'
      AuthorizationType: JWT
      AuthorizerId: !Ref AdminApiAuthorizer
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminOverridesRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'GET /internal-api/overrides'
      AuthorizationType: JWT
      AuthorizerId: !Ref AdminApiAuthorizer
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminPutCentreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'PUT /internal-api/centres/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AdminApiAuthorizer
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminCreateCentreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'POST /internal-api/centres'
      AuthorizationType: JWT
      AuthorizerId: !Ref AdminApiAuthorizer
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminDeleteCentreRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref AdminApi
      RouteKey: 'DELETE /internal-api/centres/{id}'
      AuthorizationType: JWT
      AuthorizerId: !Ref AdminApiAuthorizer
      Target: !Sub 'integrations/${AdminApiIntegration}'

  AdminApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${AdminApi}/*/*'

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
        Comment: !Sub '${DomainName} static site'
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt RouteRewriteFunction.FunctionARN
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          TargetOriginId: site-bucket
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt SiteBucket.RegionalDomainName
            Id: site-bucket
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig: {}
          - DomainName: !Sub '${AdminApi}.execute-api.${AWS::Region}.amazonaws.com'
            Id: admin-api
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        CacheBehaviors:
          - PathPattern: 'internal-api/*'
            TargetOriginId: admin-api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
          - PathPattern: 'data/centres.json'
            TargetOriginId: admin-api
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            # AWS managed CachingOptimized. The Lambda response's s-maxage=60
            # controls freshness; using an existing policy avoids a CloudFront
            # eventual-consistency race when a policy and distribution are
            # created in the same stack update.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            Compress: true
            ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

  DomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  DomainRecordIpv6:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  InternalEditorUrl:
    Value: !Sub 'https://${DomainName}/internal/'
  AdminUserPoolId:
    Value: !Ref AdminUserPool
  AdminUserPoolClientId:
    Value: !Ref AdminUserPoolClient
  AdminApiUrl:
    Value: !GetAtt AdminApi.ApiEndpoint
