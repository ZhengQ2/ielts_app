name: IDP India and China availability validation

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Regional provider to validate"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - idp_india
          - idp_china
      confirmed:
        description: "Run anonymous, serial full-scale provider reads"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: idp-regional-availability-full-scale
  cancel-in-progress: false

jobs:
  verify-code:
    if: inputs.confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production static export
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
        run: npm run build

  idp-india:
    if: >-
      inputs.confirmed &&
      (inputs.provider == 'both' || inputs.provider == 'idp_india')
    needs: verify-code
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan every anonymous IDP India test, module and city serially
        env:
          M2_7_LIVE_EXPERIMENT: "true"
          IDP_INDIA_MIN_INTERVAL_MS: "3000"
        run: npm run availability:idp-india-full-scale

      - name: Upload IDP India diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-india-full-scale
          path: .artifacts/provider-availability.idp-india.full-scale.json
          if-no-files-found: error
          retention-days: 30

  idp-china:
    if: >-
      inputs.confirmed &&
      (inputs.provider == 'both' || inputs.provider == 'idp_china')
    needs: verify-code
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan every anonymous IDP China session page serially
        env:
          M2_7_LIVE_EXPERIMENT: "true"
          IDP_CHINA_MIN_INTERVAL_MS: "3000"
          IDP_CHINA_PAGE_SIZE: "100"
        run: npm run availability:idp-china-full-scale

      - name: Upload IDP China diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-china-full-scale
          path: .artifacts/provider-availability.idp-china.full-scale.json
          if-no-files-found: error
          retention-days: 30
