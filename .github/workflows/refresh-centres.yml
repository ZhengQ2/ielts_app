name: Refresh IELTS centre dataset

on:
  schedule:
    # Weekly, Mondays 05:00 UTC. Weekly rather than nightly on purpose: a run
    # re-fetches all ~1,850 centre pages from ielts.org, and the source changes
    # far more slowly than that. DEV_PLAN §5.6 specifies a weekly re-crawl.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      country:
        description: "ISO country code to build, or ALL"
        required: false
        default: "ALL"

permissions:
  contents: write

concurrency:
  # Never let two crawls race to commit the same dataset.
  group: m2-7-${{ inputs.country || 'refresh-centres' }}
  cancel-in-progress: false

jobs:
  refresh:
    if: inputs.country != 'M2_7_FULL_SCALE' && inputs.country != 'M2_7_IDP_INDIA_SMOKE'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # A parser regression would quietly rewrite the dataset with garbage,
        # and the job commits its own output — so the guard runs before the
        # crawl, not after.
        run: npm test

      # Note there is deliberately no cache of the fetched HTML. The point of a
      # scheduled run is to see the source as it is *now*, so it refetches every
      # page; caching ~300 MB weekly to then ignore it would be pure waste.
      # The geocode cache is the one worth keeping, and that lives in the repo.
      - name: Crawl, geocode and diff
        id: ingest
        env:
          # Google is the production address + venue evidence provider. The
          # key is restricted to Geocoding and Places API (New). Without it the
          # job still runs with the slow no-key development fallback.
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Country-specific tail providers. They are consulted only when a
          # China/India result remains below street-level precision. Local text
          # may support matching, but localized addresses are not displayed.
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}
          MAPPLS_API_KEY: ${{ secrets.MAPPLS_API_KEY }}
        run: |
          cd packages/ingest
          node --experimental-strip-types src/cli.ts \
            --country "${{ inputs.country || 'ALL' }}" \
            --force

      - name: Refresh operator-supported availability
        id: availability
        continue-on-error: true
        run: npm run availability

      - name: Flag availability refresh failure
        if: always() && steps.availability.outcome == 'failure'
        run: |
          echo "::warning::The IELTS USA status snapshot could not be refreshed. The last good snapshot remains in place and expires to unknown after 15 days."

      - name: Flag newly unmatched directory centres
        if: always() && steps.availability.outputs.new_unmatched_centres != '' && steps.availability.outputs.new_unmatched_centres != '0'
        run: |
          echo "::warning::${{ steps.availability.outputs.new_unmatched_centres }} IELTS USA directory centre(s) lost a safe operator-status match. They now display availability as unknown; see the operator-availability artifact."

      - name: Upload automated centre-quality analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centre-quality-${{ inputs.country || 'ALL' }}
          path: .artifacts/centre-quality.*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload operator-availability analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-availability
          path: .artifacts/operator-availability.*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Flag quarantined discoveries
        if: always() && steps.ingest.outputs.quarantined_new_centres != '' && steps.ingest.outputs.quarantined_new_centres != '0'
        run: |
          echo "::warning::${{ steps.ingest.outputs.quarantined_new_centres }} newly discovered centre source(s) were quarantined or could not be parsed. See the job summary and centre-quality artifact."

      - name: Flag publishable discoveries needing review
        if: always() && steps.ingest.outputs.new_centres_needing_review != '' && steps.ingest.outputs.new_centres_needing_review != '0'
        run: |
          echo "::warning::${{ steps.ingest.outputs.new_centres_needing_review }} newly discovered centre(s) are publishable but have quality warnings. See the job summary and centre-quality artifact."

      - name: Flag existing-centre quality regressions
        if: always() && steps.ingest.outputs.quality_regressions != '' && steps.ingest.outputs.quality_regressions != '0'
        run: |
          echo "::warning::${{ steps.ingest.outputs.quality_regressions }} new quality issue(s) appeared on existing centres. See the quality trend in the job summary."

      - name: Report accepted automatic repairs
        if: always() && steps.ingest.outputs.remediations_accepted != '' && steps.ingest.outputs.remediations_accepted != '0'
        run: |
          echo "::notice::${{ steps.ingest.outputs.remediations_accepted }} evidence-backed centre repair(s) were accepted and re-validated."

      - name: Verify the site still builds against the new data
        # The dataset is bundled at build time, so a shape change that breaks
        # the app must not be committed.
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
        run: npm run build

      - name: Commit the refreshed dataset
        if: steps.ingest.outputs.changed == 'true' || steps.availability.outputs.refreshed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/core/data data/geocode-cache.json

          # Test the index rather than the working tree: --porcelain also
          # reports untracked build output and would fail on an empty commit.
          if git diff --cached --quiet; then
            echo "Nothing staged."
          else
            git commit -m "Refresh centres: ${{ steps.ingest.outputs.summary }} [skip ci]"
            git push
          fi

      # New geocode results are worth keeping even when no centre changed —
      # they are what stops the next run re-billing Google for the same address.
      - name: Commit geocode cache only
        if: steps.ingest.outputs.changed != 'true' && steps.availability.outputs.refreshed != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/geocode-cache.json
          if git diff --cached --quiet; then
            echo "No new geocode entries."
          else
            git commit -m "Update geocode cache [skip ci]"
            git push
          fi

  m2-7-preflight:
    if: inputs.country == 'M2_7_FULL_SCALE' || inputs.country == 'M2_7_IDP_INDIA_SMOKE'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production static export
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
        run: npm run build

  m2-7-idp-global:
    if: inputs.country == 'M2_7_FULL_SCALE'
    permissions:
      contents: read
    needs: m2-7-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full-scale IDP Global validation
        env:
          M2_7_LIVE_EXPERIMENT: "true"
          IDP_GLOBAL_MIN_INTERVAL_MS: "1500"
          IDP_GLOBAL_HORIZON_DAYS: "180"
        run: npm run availability:idp-global-full-scale

      - name: Upload IDP Global diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-global-full-scale
          path: .artifacts/provider-availability.idp-global.full-scale.json
          if-no-files-found: error
          retention-days: 30

  m2-7-idp-india:
    if: inputs.country == 'M2_7_FULL_SCALE' || inputs.country == 'M2_7_IDP_INDIA_SMOKE'
    permissions:
      contents: read
    needs: m2-7-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -z "$chrome_path" ]]; then
            echo "::error::Chrome is not installed on this isolated runner."
            exit 1
          fi
          echo "path=$chrome_path" >> "$GITHUB_OUTPUT"

      - name: Run full-scale IDP India validation
        env:
          M2_7_LIVE_EXPERIMENT: "true"
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
          IDP_INDIA_MIN_INTERVAL_MS: "3000"
          IDP_INDIA_MAX_TARGETS: ${{ inputs.country == 'M2_7_IDP_INDIA_SMOKE' && '1' || '' }}
        run: npm run availability:idp-india-full-scale

      - name: Upload IDP India diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-india-full-scale
          path: .artifacts/provider-availability.idp-india.full-scale.json
          if-no-files-found: error
          retention-days: 30
