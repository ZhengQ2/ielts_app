name: British Council Global availability probe

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "Run one anonymous request to the official BC registration root"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: bc-global-availability-probe
  cancel-in-progress: false

jobs:
  verify-code:
    if: inputs.confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production static export
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
        run: npm run build

  clean-root:
    if: inputs.confirmed
    needs: verify-code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect the official BC registration landing page once
        env:
          M2_7_DISCOVERY_EXPERIMENT: "true"
          PROVIDER_PROBE_INTERVAL_MS: "15000"
          PROVIDER_PROBE_TARGETS_JSON: >-
            [{"id":"bc-global-root","source":"bc_global","url":"https://ieltsregistration.britishcouncil.org/"}]
        run: npm run availability:surface-probe

      - name: Upload BC Global probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bc-global-root-probe
          path: |
            .artifacts/provider-surface-probe.json
            .artifacts/provider-surface-probe/
          if-no-files-found: error
          retention-days: 14
