name: Provider availability full-scale validation

on:
  workflow_dispatch:
    inputs:
      confirmed:
        description: "Run the full serial IDP Global validation"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: provider-availability-full-scale
  cancel-in-progress: false

jobs:
  verify-code:
    if: inputs.confirmed
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build production static export
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_GOOGLE_MAP_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAP_ID }}
        run: npm run build

  idp-global:
    if: inputs.confirmed
    needs: verify-code
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan every discovered IDP Global city and venue serially
        env:
          M2_7_LIVE_EXPERIMENT: "true"
          IDP_GLOBAL_MIN_INTERVAL_MS: "1500"
          IDP_GLOBAL_HORIZON_DAYS: "45"
        run: npm run availability:idp-global-full-scale

      - name: Upload IDP Global diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idp-global-full-scale
          path: .artifacts/provider-availability.idp-global.full-scale.json
          if-no-files-found: error
          retention-days: 30

  excluded-providers:
    if: inputs.confirmed
    runs-on: ubuntu-latest
    steps:
      - name: Record deliberate exclusions
        run: |
          echo "IDP China excluded: its public route redirects to login."
          echo "IDP India bulk scan excluded: safe calendar discovery did not produce defensible future date/time evidence."
          echo "NEEA excluded: British Council-only China partner requiring login and reCAPTCHA."
          echo "British Council Global excluded: bounded GitHub Actions probe returned CDN HTTP 403."
