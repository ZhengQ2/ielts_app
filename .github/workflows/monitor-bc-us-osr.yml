name: Monitor British Council USA OSR policy

on:
  schedule:
    # Four low-volume checks per day keep the warning current without putting
    # browser-like traffic on British Council's registration systems.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: monitor-bc-us-osr-policy
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the policy parser
        run: node --test --experimental-strip-types packages/ingest/test/bc-us-osr-policy.test.ts

      - name: Check the official British Council policy
        id: policy
        run: npm run monitor:bc-us-osr

      - name: Open a manual policy-review issue
        if: steps.policy.outputs.review_required == 'true'
        uses: actions/github-script@v7
        env:
          POLICY_OBSERVATION: ${{ steps.policy.outputs.observation }}
          POLICY_AUTHORITATIVE: ${{ steps.policy.outputs.authoritative }}
          CURRENT_UNAVAILABLE: ${{ steps.policy.outputs.current_unavailable }}
        with:
          script: |
            const title = 'Review British Council USA One Skill Retake policy';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The advisory monitor found wording that needs human verification.',
              '',
              `- Observation: ${process.env.POLICY_OBSERVATION}`,
              `- Read directly from British Council: ${process.env.POLICY_AUTHORITATIVE}`,
              `- Current warning says unavailable: ${process.env.CURRENT_UNAVAILABLE}`,
              `- Official page: https://takeielts.britishcouncil.org/take-ielts/one-skill-retake`,
              `- Workflow run: ${runUrl}`,
              '',
              'The workflow intentionally did not change or deploy the production policy. Verify the official page in a browser, then update `packages/core/data/after-test-policy.json` manually if needed.',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (!existing) {
              await github.rest.issues.create({ ...context.repo, title, body });
            } else {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: 'open',
                body,
              });
            }
